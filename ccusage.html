<script>
  // Resolve theme before first paint so there's no flash
  (function(){
    let pref = 'system';
    try { pref = localStorage.getItem('ccusage-theme') || 'system'; } catch (e) {}
    const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
  })();
</script>

<style>
  :root{
    --ink: var(--text-color-kumo-strong, #111);
    --ink-2: var(--text-color-kumo-default, #333);
    --muted: var(--text-color-kumo-subtle, #777);
    --rule: var(--color-kumo-hairline, #e5e5e5);
    --paper: var(--color-kumo-base, #fff);
    --accent: #e8702a;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  [data-mode="dark"]{ --accent: #f0914f; }
  html,body{background:var(--paper)}
  body{margin:0;color:var(--ink-2);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  main{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  .mono{font-family:var(--mono)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--rule)}
  .masthead b{color:var(--ink);font-weight:500}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .seg{display:inline-flex;border:1px solid var(--color-kumo-line);border-radius:6px;overflow:hidden}
  .seg button{all:unset;cursor:pointer;padding:4px 10px;font:12px var(--mono);color:var(--muted)}
  .seg button + button{border-left:1px solid var(--color-kumo-line)}
  .seg button[aria-pressed="true"]{background:var(--color-kumo-tint);color:var(--ink)}
  .linkish{all:unset;cursor:pointer;font:12px var(--mono);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .linkish:hover{color:var(--ink)}
  .linkish input{display:none}

  .lede{padding:40px 0 28px;max-width:760px}
  .lede .big{font:500 clamp(40px,7vw,64px)/1 var(--mono);color:var(--ink);letter-spacing:-0.03em}
  .lede p{font-size:18px;line-height:1.55;margin:14px 0 0;color:var(--ink-2)}
  .lede p em{font-style:normal;color:var(--ink);font-family:var(--mono);font-size:16px}

  .strip{margin-top:24px;display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .strip div{padding:12px 24px 12px 0;margin-right:24px}
  .strip div + div{padding-left:24px;border-left:1px solid var(--rule);margin-left:-24px}
  .strip dt{font:11px var(--mono);color:var(--muted);text-transform:lowercase}
  .strip dd{margin:2px 0 0;font:500 17px var(--mono);color:var(--ink)}

  section{padding-top:36px}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  h2{margin:0;font:600 15px var(--sans);color:var(--ink)}
  .note{font-size:13px;color:var(--muted);margin:2px 0 0}
  .cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:40px}
  @media (max-width:860px){.cols{grid-template-columns:1fr;gap:0}}

  .key{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 4px;font:12px var(--mono);color:var(--muted)}
  .key span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:0}
  .key b{color:var(--ink);font-weight:500;margin-left:4px}

  .bars{list-style:none;margin:8px 0 0;padding:0}
  .bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .bars .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .bars .val{font-family:var(--mono);color:var(--ink)}
  .bars .val small{color:var(--muted);margin-left:6px}
  .bars .track{grid-column:1 / -1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
  .bars .fill{height:100%;background:var(--c);border-radius:2px}

  .split{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:14px 0 10px;gap:2px}
  .split span{background:var(--c);min-width:2px}

  .tbl{max-height:460px;overflow:auto;border-top:1px solid var(--rule)}
  .tbl table{font-size:13px}
  .tbl th{cursor:pointer;user-select:none;font:500 11px var(--mono);color:var(--muted);text-transform:lowercase;position:sticky;top:0;background:var(--paper)}
  .tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tbl .agents{font:12px var(--mono);color:var(--muted)}
  footer{margin-top:48px;font:12px var(--mono);color:var(--muted)}
  #err{color:#c33;white-space:pre-wrap;padding:16px;font-family:monospace}
</style>
</head>

<script type="module">
import React, { useState, useMemo, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import * as echarts from 'echarts';
import { TimeseriesChart, Chart, ChartPalette } from 'kumo/components/chart';
import { Select } from 'kumo/components/select';
import { Table } from 'kumo/components/table';

const html = htm.bind(React.createElement);
const SNAPSHOT = '2026-09-22 18:52';
const usd = v => '$' + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = v => '$' + Math.round(v).toLocaleString();
const tok = v => v >= 1e9 ? (v/1e9).toFixed(2)+'B' : v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : String(Math.round(v));
const ts = p => Date.UTC(+p.slice(0,4), +p.slice(5,7)-1, +p.slice(8,10));
const shortDate = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const longDate = p => new Date(ts(p)).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });

const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};

function useTheme(){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const [pref, setPref] = useState(() => store.get('ccusage-theme') || 'system');
  const [osDark, setOsDark] = useState(mq.matches);
  useEffect(() => { const f = () => setOsDark(mq.matches); mq.addEventListener('change', f); return () => mq.removeEventListener('change', f); }, []);
  const dark = pref === 'dark' || (pref === 'system' && osDark);
  useEffect(() => { document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light'); store.set('ccusage-theme', pref); }, [dark, pref]);
  return [pref, setPref, dark];
}

const TOKEN_TYPES = [
  ['cacheReadTokens', 'cache read'],
  ['cacheCreationTokens', 'cache write'],
  ['inputTokens', 'input'],
  ['outputTokens', 'output'],
];
const RANGE_LABEL = { '30': 'the last 30 days', '90': 'the last 90 days', '180': 'the last 180 days', '0': 'all time' };

function App(){
  const [pref, setPref, dark] = useTheme();
  const [data, setData] = useState(() => JSON.parse(document.getElementById('ccusage-data').textContent));
  const [range, setRange] = useState(() => store.get('ccusage-range') || '90');
  const [agent, setAgent] = useState('all');
  const [tokenView, setTokenView] = useState('nocache');
  useEffect(() => store.set('ccusage-range', range), [range]);

  const agents = useMemo(() => [...new Set(data.daily.flatMap(r => r.metadata?.agents || []))].sort(), [data]);

  const rows = useMemo(() => {
    let r = data.daily.slice().sort((a,b) => a.period.localeCompare(b.period));
    if (+range) { const c = new Date(); c.setDate(c.getDate() - +range + 1); const cut = c.toISOString().slice(0,10); r = r.filter(x => x.period >= cut); }
    if (agent !== 'all') r = r.filter(x => (x.metadata?.agents || []).includes(agent));
    return r;
  }, [data, range, agent]);

  const models = useMemo(() => {
    const m = {};
    for (const r of rows) for (const b of r.modelBreakdowns || []) {
      const t = m[b.modelName] ||= { model: b.modelName, cost: 0, input: 0, output: 0, cw: 0, cr: 0, days: 0 };
      t.cost += b.cost || 0; t.input += b.inputTokens; t.output += b.outputTokens; t.cw += b.cacheCreationTokens; t.cr += b.cacheReadTokens; t.days++;
    }
    return Object.values(m).sort((a,b) => b.cost - a.cost);
  }, [rows]);

  const sum = k => rows.reduce((s,r) => s + (r[k] || 0), 0);
  const cost = sum('totalCost'), tokens = sum('totalTokens');
  const peak = rows.reduce((p,r) => r.totalCost > (p?.totalCost || 0) ? r : p, null);
  const inputSide = sum('cacheReadTokens') + sum('inputTokens') + sum('cacheCreationTokens');
  const accent = dark ? '#f0914f' : '#e8702a';
  const muted = dark ? '#5b5b5b' : '#c4c4c4';
  const axisText = ChartPalette.text('primary', dark);

  // A few series need distinct colours; keep the rest quiet
  const top = models.slice(0, 5).map(m => m.model);
  const modelColor = m => { const i = top.indexOf(m); return i < 0 ? muted : ChartPalette.categorical(i, dark); };
  const tokenColor = i => [ChartPalette.categorical(0, dark), ChartPalette.categorical(3, dark), ChartPalette.categorical(4, dark), accent][i];

  const tokenSeries = tokenView === 'total'
    ? [{ name: 'total', color: accent, data: rows.map(r => [ts(r.period), r.totalTokens]) }]
    : TOKEN_TYPES.map(([k, name], i) => ({ name, color: tokenColor(i), data: rows.map(r => [ts(r.period), r[k]]) }))
        .filter((_, i) => tokenView === 'type' || i >= 2);

  const dailyOpts = useMemo(() => ({
    backgroundColor: 'transparent',
    textStyle: { fontFamily: 'IBM Plex Mono, monospace' },
    grid: { left: 0, right: 4, top: 12, bottom: 4, containLabel: true },
    tooltip: { trigger: 'axis', valueFormatter: v => v ? usd(v) : '–', order: 'valueDesc', axisPointer: { type: 'shadow' } },
    xAxis: { type: 'category', data: rows.map(r => r.period), axisTick: { show: false },
      axisLine: { lineStyle: { color: muted } }, axisLabel: { color: axisText, fontSize: 11, formatter: v => shortDate(ts(v)) } },
    yAxis: { type: 'value', axisLabel: { color: axisText, fontSize: 11, formatter: v => '$' + v },
      splitLine: { lineStyle: { color: dark ? '#2a2a2a' : '#eeeeee', type: [2, 3] } } },
    series: [...top, 'other'].map(m => ({
      name: m, type: 'bar', stack: 'cost', barMaxWidth: 14, itemStyle: { color: modelColor(m) },
      data: rows.map(r => (r.modelBreakdowns || []).filter(b => m === 'other' ? !top.includes(b.modelName) : b.modelName === m).reduce((s,b) => s + (b.cost || 0), 0)),
    })).filter(s => s.data.some(v => v > 0)),
  }), [rows, dark, models]);

  const monthly = {};
  for (const r of rows) { const k = r.period.slice(0,7) + '-01'; monthly[k] = (monthly[k] || 0) + r.totalCost; }
  const months = Object.keys(monthly).sort();
  const monthlyOpts = {
    backgroundColor: 'transparent',
    textStyle: { fontFamily: 'IBM Plex Mono, monospace' },
    grid: { left: 0, right: 4, top: 20, bottom: 4, containLabel: true },
    tooltip: { trigger: 'axis', valueFormatter: usd, axisPointer: { type: 'shadow' } },
    xAxis: { type: 'category', data: months, axisTick: { show: false }, axisLine: { lineStyle: { color: muted } },
      axisLabel: { color: axisText, fontSize: 11, formatter: k => new Date(ts(k)).toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' }) } },
    yAxis: { type: 'value', axisLabel: { show: false }, splitLine: { show: false } },
    series: [{ type: 'bar', barMaxWidth: 26, itemStyle: { color: accent, borderRadius: [2, 2, 0, 0] }, data: months.map(k => monthly[k]),
      label: { show: true, position: 'top', color: axisText, fontSize: 11, formatter: p => usd0(p.value) } }],
  };

  const otherCost = models.slice(5).reduce((s,m) => s + m.cost, 0);
  const spend = [...models.slice(0,5).map(m => ({ name: m.model, v: m.cost, c: modelColor(m.model) })),
    ...(otherCost ? [{ name: `${models.length - 5} others`, v: otherCost, c: muted }] : [])];
  const mix = TOKEN_TYPES.map(([k, name], i) => ({ name, v: sum(k), c: tokenColor(i) }));

  const readFile = e => { const f = e.target.files[0]; if (f) f.text().then(t => setData(JSON.parse(t))); };
  const lastDay = data.daily.map(r => r.period).sort().at(-1);

  return html`
  <main>
    <header class="masthead">
      <span><b>ccusage</b> · data through ${lastDay}</span>
      <div class="controls">
        <${Select} aria-label="Date range" size="sm" value=${range} onValueChange=${setRange}
          items=${{ '30': '30 days', '90': '90 days', '180': '180 days', '0': 'All time' }} />
        <${Select} aria-label="Agent" size="sm" value=${agent} onValueChange=${setAgent}
          items=${Object.fromEntries([['all', 'All agents'], ...agents.map(a => [a, a])])} />
        <div class="seg" role="group" aria-label="Theme">
          ${['system', 'light', 'dark'].map(p => html`<button key=${p} aria-pressed=${pref === p} onClick=${() => setPref(p)}>${p}</button>`)}
        </div>
      </div>
    </header>


    <dl class="strip">
      <div><dt>cost</dt><dd>${usd(cost)}</dd></div>
      <div><dt>active days</dt><dd>${rows.length}</dd></div>
      <div><dt>peak day</dt><dd>${peak ? usd(peak.totalCost) : '–'}</dd></div>
      <div><dt>tokens</dt><dd>${tok(tokens)}</dd></div>
      <div><dt>output tokens</dt><dd>${tok(sum('outputTokens'))}</dd></div>
      <div><dt>served from cache</dt><dd>${(sum('cacheReadTokens') / Math.max(1, inputSide) * 100).toFixed(1)}%</dd></div>
      <div><dt>models used</dt><dd>${models.length}</dd></div>
    </dl>

    <section>
      <div class="sec-head">
        <div>
          <h2>Tokens per day</h2>
          <p class="note">${tokenView === 'type' ? 'Cache reads dwarf everything else, which is why input + output is the default.' : tokenView === 'total' ? 'Everything combined, cache included.' : 'Fresh input and generated output, cache excluded.'}</p>
        </div>
        <${Select} aria-label="Token view" size="sm" value=${tokenView} onValueChange=${setTokenView}
          items=${{ nocache: 'Input + output', type: 'All four types', total: 'Total' }} />
      </div>
      <div class="key">
        ${tokenSeries.map(s => html`<span key=${s.name} style=${{ '--c': s.color }}>${s.name}<b>${tok(s.data.reduce((a, [, v]) => a + v, 0))}</b></span>`)}
      </div>
      <${TimeseriesChart} echarts=${echarts} isDarkMode=${dark} data=${tokenSeries} type="line"
        height=${300} yAxisTickFormat=${tok} tooltipValueFormat=${tok} xAxisTickFormat=${shortDate} tooltipFollowCursor="x" />
    </section>

    <section class="cols">
      <div>
        <h2>Cost per day, by model</h2>
        <div class="key">
          ${spend.map(s => html`<span key=${s.name} style=${{ '--c': s.c }}>${s.name}</span>`)}
        </div>
        <${Chart} echarts=${echarts} isDarkMode=${dark} options=${dailyOpts} height=${300} optionUpdateBehavior=${{ notMerge: true }} />
      </div>
      <div>
        <h2>Where it went</h2>
        <ul class="bars">
          ${spend.map(s => html`<li key=${s.name} style=${{ '--c': s.c }}>
            <span class="name">${s.name}</span>
            <span class="val">${usd0(s.v)}<small>${(s.v / Math.max(cost, 1e-9) * 100).toFixed(0)}%</small></span>
            <span class="track"><span class="fill" style=${{ width: (s.v / (spend[0]?.v || 1) * 100) + '%' }}></span></span>
          </li>`)}
        </ul>
      </div>
    </section>

    <section class="cols">
      <div>
        <h2>By month</h2>
        <${Chart} echarts=${echarts} isDarkMode=${dark} options=${monthlyOpts} height=${220} optionUpdateBehavior=${{ notMerge: true }} />
      </div>
      <div>
        <h2>What the tokens were</h2>
        <div class="split">
          ${mix.map(s => html`<span key=${s.name} title=${s.name} style=${{ '--c': s.c, flex: s.v }}></span>`)}
        </div>
        <ul class="bars">
          ${mix.map(s => html`<li key=${s.name} style=${{ '--c': s.c }}>
            <span class="name">${s.name}</span>
            <span class="val">${tok(s.v)}<small>${(s.v / Math.max(tokens, 1) * 100).toFixed(1)}%</small></span>
          </li>`)}
        </ul>
      </div>
    </section>

    <section>
      <h2>Models</h2>
      <p class="note">Click a column to sort.</p>
      <${SortTable}
        head=${['model', 'cost', 'days', 'input', 'output', 'cache write', 'cache read']}
        rows=${models.map(m => [m.model, m.cost, m.days, m.input, m.output, m.cw, m.cr])}
        fmt=${(v, i) => i === 1 ? usd(v) : i > 2 ? tok(v) : v} />
    </section>

    <section>
      <h2>Days</h2>
      <${SortTable}
        head=${['date', 'cost', 'tokens', 'output', 'models', 'agents']}
        rows=${rows.slice().reverse().map(r => [r.period, r.totalCost, r.totalTokens, r.outputTokens, (r.modelsUsed || []).length, (r.metadata?.agents || []).join(', ')])}
        fmt=${(v, i) => i === 1 ? usd(v) : i === 2 || i === 3 ? tok(v) : i === 5 ? html`<span class="agents">${v}</span>` : v} />
    </section>

    <footer>
      snapshot ${SNAPSHOT} · refresh with <span class="mono">bunx ccusage daily --json > ccusage-daily.json</span>, then${' '}
      <label class="linkish">load it<input type="file" accept=".json" onChange=${readFile} /></label>
    </footer>
  </main>`;
}

function SortTable({ head, rows, fmt }){
  const [sort, setSort] = useState(null);
  const sorted = useMemo(() => !sort ? rows : rows.slice().sort((a, b) => {
    const x = a[sort.i], y = b[sort.i];
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sort.dir;
  }), [rows, sort]);
  const numeric = i => typeof rows[0]?.[i] === 'number';
  const click = i => setSort(s => ({ i, dir: s?.i === i ? -s.dir : -1 }));
  return html`
    <div class="tbl">
      <${Table}>
        <${Table.Header}><${Table.Row}>
          ${head.map((h, i) => html`<${Table.Head} key=${h} className=${numeric(i) ? 'n' : ''} onClick=${() => click(i)}>
            ${h}${sort?.i === i ? (sort.dir > 0 ? ' ↑' : ' ↓') : ''}<//>`)}
        <//><//>
        <${Table.Body}>
          ${sorted.map(r => html`<${Table.Row} key=${r[0]}>
            ${r.map((v, i) => html`<${Table.Cell} key=${i} className=${typeof v === 'number' ? 'n' : ''}>${fmt(v, i)}<//>`)}
          <//>`)}
        <//>
      <//>
    </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
